<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Header Navigation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- nav bar -->
    <nav class="nav">
      <div class="nav-container">
        <!-- logo -->
        <div class="logo">
          <a href="#" aria-label="Home">CodeLearn</a>
          <button
            class="menu-toggle"
            type="button"
            aria-label="Open navigation menu"
          >
            &#9776;
          </button>
        </div>
        <!-- links -->
        <div class="link">
          <a href="#">Features</a>
          <a href="#">Docs</a>
        </div>
        <!-- buttons -->
        <div class="auth-actions">
          <a class="button button-secondary" href="#">Log in</a>
          <a class="button button-primary" href="#">Sign up</a>
        </div>
      </div>
    </nav>

    <main>
      <section class="hero">
        <div class="hero-container">
          <div class="hero-content">
            <h1 class="hero-title">Learn HTML and CSS with guided practice</h1>
            <p class="hero-subtitle">
              Follow focused examples, preview real layouts, and turn each
              concept into a clean responsive page.
            </p>
          </div>
          <div class="hero-actions">
            <a class="button button-primary" href="#">Start learning</a>
            <a class="button button-secondary" href="#">View examples</a>
          </div>
        </div>
      </section>

      <!-- cards -->
      <section class="cards">
        <div class="cards-container">
          <div class="cards-items">
            <div class="card-item">
              <img src="assets/IMG_0228.JPEG" alt="liu" />
              <p class="card-des">6th year concert</p>
            </div>
            <div class="card-item">
              <img src="assets/IMG_9774.JPEG" alt="song" />
              <p class="card-des">6th year concert</p>
            </div>
            <div class="card-item">
              <img src="assets/IMG_0657.JPEG" alt="dog" />
              <p class="card-des">dog</p>
            </div>
          </div>
        </div>
      </section>
      <section class="fan-board">
        <div class="fan-board__layout">
          <div class="fan-board_media">
            <img
              class="fan-board__image"
              src="assets/fan-board.jpeg"
              alt="桌面上的电脑和学习笔记"
            />
          </div>
          <!-- fanboard -->
          <div class="fan-board__content">
            <p class="fan-board__label">Fan Board</p>
            <h2 class="fan-board__title">粉丝留言板</h2>
            <p class="fan-board__text">留下一张小纸条吧。</p>

            <form class="fan-board__form" id="fan-board-form" novalidate>
              <label class="fan-board__field">
                <span>Name</span>
                <input name="name" type="text" autocomplete="name" />
                <small class="fan-board__error" data-error-for="name"></small>
              </label>

              <label class="fan-board__field">
                <span>Email</span>
                <input name="email" type="email" autocomplete="email" />
                <small class="fan-board__error" data-error-for="email"></small>
              </label>

              <label class="fan-board__field">
                <span>Message</span>
                <textarea name="message" rows="5"></textarea>
                <small
                  class="fan-board__error"
                  data-error-for="message"
                ></small>
              </label>

              <button class="fan-board__submit" type="submit">送出留言</button>
              <p class="fan-board__status" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </section>

      <!-- btn to top -->
      <button class="to-top" type="button" aria-label="返回顶部">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5" />
          <path d="M5 12l7-7 7 7" />
        </svg>
      </button>
    </main>
  </body>
  <script src="script.js"></script>
</html>
